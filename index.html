<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SENSI X IA - Calibrador Free Fire</title>
<style>
:root{--bg:#0A0A0A;--card:#121212;--red:#FF0040;--red2:#FF4D7A;--line:rgba(255,255,255,.1)}
*{box-sizing:border-box;margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{background:var(--bg);color:#fff;min-height:100vh;padding:calc(20px + env(safe-area-inset-top)) 16px 40px}
.wrap{max-width:400px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-size:28px;font-weight:800;text-align:center;line-height:1.1}
h1 span{color:var(--red)}
.sub{font-size:13px;color:rgba(255,255,255,.6);text-align:center;line-height:1.5}
.card{background:#0F0F0F;border:1px solid rgba(255,0,64,.5);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:14px;box-shadow:0 0 30px rgba(255,0,64,.12)}
.lbl{font-size:10px;letter-spacing:.16em;color:rgba(255,255,255,.4)}
.row{display:grid;gap:8px}.c2{grid-template-columns:1fr 1fr}.c3{grid-template-columns:1fr 1fr 1fr}
button{cursor:pointer;color:inherit;border:1px solid var(--line);background:#1A1A1A;border-radius:12px;height:46px;font-weight:700;font-size:12px;letter-spacing:.08em}
button.on{background:var(--red);border-color:var(--red2);box-shadow:0 0 14px rgba(255,0,64,.5)}
button.go{height:54px;font-size:14px;letter-spacing:.12em;background:linear-gradient(#FF0040,#CC0033);border-color:var(--red)}
button:disabled{opacity:.6}
input{width:100%;height:46px;border-radius:12px;background:#161616;border:1px solid var(--line);color:#fff;padding:0 14px;font-size:14px}
input:focus{outline:none;border-color:rgba(255,0,64,.6)}
.list{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:#161616;border:1px solid var(--line);border-radius:14px;max-height:220px;overflow-y:auto;z-index:5}
.list div{padding:10px 14px;display:flex;justify-content:space-between;font-size:13px;cursor:pointer}
.list div:hover{background:rgba(255,255,255,.06)}.list small{color:rgba(255,255,255,.4)}
.res{display:none}.res.show{display:flex}
.item{display:flex;align-items:center;justify-content:space-between;background:#151515;border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:0 14px;height:48px;font-size:12px;font-weight:600;text-transform:uppercase}
.bar{width:70px;height:6px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden;display:inline-block;margin-right:10px;vertical-align:middle}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#FF0040,#FF7A9E)}
.val{font-size:17px;font-weight:800;display:inline-block;width:34px;text-align:right}
.info{background:#1A1A1A;border:1px solid var(--line);border-radius:14px;padding:12px;font-size:12px;line-height:1.6;color:rgba(255,255,255,.7)}
.tip{font-size:11px;color:rgba(255,255,255,.4);text-align:center;line-height:1.5}
#load{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:9;font-size:14px;letter-spacing:.14em}
